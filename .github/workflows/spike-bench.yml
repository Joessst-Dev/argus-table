name: Spike benchmark

# Phase 0 rendering spike: measures shadow vs. slotted cells in all three engines.
# Informational only; it never blocks a merge. Remove together with apps/spike.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per browser and variant
        default: '5'
  pull_request:
    paths:
      - apps/spike/**
      - .github/workflows/spike-bench.yml

permissions:
  contents: read

concurrency:
  group: spike-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: bench (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @argus-table/spike exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}

      - name: Install ${{ matrix.browser }}
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @argus-table/spike exec playwright install --with-deps ${{ matrix.browser }}

      - name: Install ${{ matrix.browser }} system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @argus-table/spike exec playwright install-deps ${{ matrix.browser }}

      - name: Benchmark
        env:
          BROWSERS: ${{ matrix.browser }}
          RUNS: ${{ inputs.runs || '5' }}
        run: pnpm --filter @argus-table/spike bench

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spike-bench-${{ matrix.browser }}
          path: apps/spike/bench/results
          retention-days: 30
