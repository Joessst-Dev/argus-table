name: Benchmark

# Scroll benchmark against apps/playground in all three engines. Advisory: it
# reports p95 frame time and long tasks against the gate (p95 ≤ 20 ms, no long
# task over 50 ms) in the job summary, but never fails a PR.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per browser
        default: '5'
      variants:
        description: Playground query strings to compare in the same job, comma-separated (e.g. pin=cells,pin=groups)
        default: ''
  pull_request:
    types: [labeled, opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    # On PRs, only with the `perf` label.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'perf')
    name: bench (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @argus-table/benchmarks exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}

      - name: Install ${{ matrix.browser }}
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @argus-table/benchmarks exec playwright install --with-deps ${{ matrix.browser }}

      - name: Install ${{ matrix.browser }} system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @argus-table/benchmarks exec playwright install-deps ${{ matrix.browser }}

      - name: Benchmark
        env:
          BROWSERS: ${{ matrix.browser }}
          RUNS: ${{ inputs.runs || '5' }}
          VARIANTS: ${{ inputs.variants || '' }}
        run: pnpm bench

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-${{ matrix.browser }}
          path: benchmarks/results
          retention-days: 30
