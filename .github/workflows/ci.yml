name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  # visual-update.yml starts CI this way after it commits new snapshots: a push
  # made with GITHUB_TOKEN doesn't start workflows, but a dispatch does.
  workflow_dispatch:

permissions:
  contents: read
  actions: read # nrwl/nx-set-shas looks up the last successful run on main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Every job runs on every event (no path filters) and `nx affected` exits 0
# when nothing is affected, so required checks always report.

# The runners are pinned (not ubuntu-latest) so that an image change is a
# deliberate update. Jobs that run browsers run inside the Playwright image, which
# has the browsers and their system libraries: no apt, so an Ubuntu mirror outage
# can't fail them. Its tag follows the Playwright version pinned in package.json;
# bump them together. `--user 1001` is the runner's user: the checkout is its own,
# and Firefox won't start as root with a $HOME that belongs to someone else.
jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      base: ${{ steps.shas.outputs.base }}
      head: ${{ steps.shas.outputs.head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - id: shas
        uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0

  lint:
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Prettier
        run: pnpm format:check
      - name: ESLint and type check
        run: pnpm nx affected -t lint typecheck --base=${{ needs.setup.outputs.base }} --head=${{ needs.setup.outputs.head }}

  unit:
    needs: setup
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    name: unit (${{ matrix.browser }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Vitest browser tests
        env:
          BROWSERS: ${{ matrix.browser }}
        run: pnpm nx affected -t test --base=${{ needs.setup.outputs.base }} --head=${{ needs.setup.outputs.head }}

  a11y:
    # Every Storybook story runs as a test in Chromium: it renders, its play
    # function runs, and axe checks it. A violation fails the story.
    needs: setup
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Stories with axe
        env:
          BROWSERS: chromium
        run: pnpm nx affected -t test-storybook --base=${{ needs.setup.outputs.base }} --head=${{ needs.setup.outputs.head }}

  e2e:
    needs: setup
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    name: e2e (${{ matrix.browser }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Playwright e2e against the playground
        env:
          BROWSERS: ${{ matrix.browser }}
        run: pnpm nx affected -t e2e --base=${{ needs.setup.outputs.base }} --head=${{ needs.setup.outputs.head }}

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.browser }}
          path: |
            tests/e2e/test-results
            tests/e2e/playwright-report
          retention-days: 14

  examples:
    # Packs the published packages, installs each starter in apps/examples
    # against the tarballs with npm, builds it and smoke-tests it in Chromium.
    needs: setup
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Cache npm downloads for the starters
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('apps/examples/*/package.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Smoke-test the starters
        run: pnpm nx affected -t smoke --base=${{ needs.setup.outputs.base }} --head=${{ needs.setup.outputs.head }}

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: examples
          path: |
            apps/examples/test-results
            apps/examples/playwright-report
          retention-days: 14

  visual:
    # Inside the Playwright image, so fonts and rendering match the baselines in
    # tests/visual/__screenshots__ (made by visual-update.yml in the same image).
    needs: setup
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Trust the checkout (the container runs as another user)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/setup

      - name: Screenshots
        run: pnpm nx affected -t visual --base=${{ needs.setup.outputs.base }} --head=${{ needs.setup.outputs.head }}

      - name: Upload the diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diffs
          path: |
            tests/visual/test-results
            tests/visual/playwright-report
          retention-days: 14

  build:
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Build
        run: pnpm nx affected -t build --base=${{ needs.setup.outputs.base }} --head=${{ needs.setup.outputs.head }}

  size:
    # Always runs (not `affected`): the budget is a gate, and a dependency bump
    # can grow the bundle without touching packages/table.
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Size budgets (argus-table CDN build, @argus-table/formulas, @argus-table/export; min+gzip)
        run: pnpm size

  changeset:
    # Docs-, CI- and tooling-only pull requests skip this with the `no-changeset` label.
    # The "Version packages" PR (changeset-release/main) consumes every changeset,
    # so it is skipped too.
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref != 'changeset-release/main' &&
      !contains(github.event.pull_request.labels.*.name, 'no-changeset')
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Every changed package has a changeset
        run: pnpm changeset status --since=origin/${{ github.base_ref }}
