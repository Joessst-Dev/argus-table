name: Update visual snapshots

# Regenerates tests/visual/__screenshots__ inside the Playwright image and
# commits them to the branch. Start it from the Actions tab (Run workflow, pick
# the branch), or add the `update-snapshots` label to a pull request from this
# repository. Pull requests from forks can't take the push; their snapshots are
# updated by a maintainer.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: visual-update-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  update:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'update-snapshots' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the new snapshots
      pull-requests: write # remove the label
      actions: write # start CI on the new commit
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BRANCH }}
      - name: Trust the checkout (the container runs as another user)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/setup

      - name: Update snapshots
        run: pnpm nx run visual:visual --skip-nx-cache -- --update-snapshots

      - name: Commit and push
        id: commit
        run: |
          git add tests/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "No snapshot changed."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update visual snapshots'
          git push origin "HEAD:$BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Remove the label
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          curl -fsS -X DELETE
          -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json'
          "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/${{ github.event.pull_request.number }}/labels/update-snapshots"
          || true

      - name: Start CI on the new commit
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          curl -fsS -X POST
          -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json'
          "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches"
          -d "{\"ref\":\"$BRANCH\"}"
