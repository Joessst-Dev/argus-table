name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Off until argus-table@0.0.1 is published by hand and npm trusted
    # publishing is linked to this workflow; then set the repository
    # variable RELEASE_ENABLED=true (Settings → Secrets and variables → Actions).
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # version commits, tags and GitHub releases
      pull-requests: write # the "Version packages" pull request
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      # The "Version packages" PR needs CI, and a push made with GITHUB_TOKEN
      # starts no workflows. A GitHub App token does. Set the repository
      # variable RELEASE_APP_CLIENT_ID and the secret RELEASE_APP_KEY to use
      # one; without them the job falls back to GITHUB_TOKEN.
      - name: GitHub App token
        id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - name: Update npm
        run: npm install -g npm@11

      - name: Version PR or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        # v2 input names; the token is an input now (an env var is ignored).
        with:
          github-token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          version-script: pnpm version-packages
          publish-script: pnpm release
          pr-title: Version packages
          commit-message: Version packages
          create-github-releases: true
