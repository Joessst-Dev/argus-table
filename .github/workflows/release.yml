name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Off until argus-table@0.0.1 is published by hand and npm trusted
    # publishing is linked to this workflow; then set the repository
    # variable RELEASE_ENABLED=true (Settings → Secrets and variables → Actions).
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # version commits, tags and GitHub releases
      pull-requests: write # the "Version packages" pull request
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - name: Update npm
        run: npm install -g npm@11

      - name: Version PR or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: Version packages
          commit: Version packages
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
