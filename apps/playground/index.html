<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>argus-table playground</title>
    <style>
      html,
      body {
        margin: 0;
        block-size: 100%;
        background: Canvas;
        color: CanvasText;
        color-scheme: light dark;
        font:
          14px/1.4 system-ui,
          sans-serif;
      }
      argus-table {
        block-size: 100vh;
      }
      /* With the Material-inspired theme, the rounded table sits on the page. */
      [data-page='inset'] body {
        box-sizing: border-box;
        padding: 16px;
      }
      [data-page='inset'] argus-table {
        block-size: calc(100vh - 32px);
      }
      .status {
        padding: 0.1em 0.5em;
        border-radius: 999px;
        background: light-dark(#eef2ff, #1e1b4b);
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
