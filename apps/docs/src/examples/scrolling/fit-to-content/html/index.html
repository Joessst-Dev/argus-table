<p class="example-controls">
  <button id="scrolling-fit-to-content-add" type="button">Add row</button>
  <button id="scrolling-fit-to-content-remove" type="button">Remove row</button>
</p>
<!-- As tall as its rows, up to 320px; past that it scrolls. -->
<argus-table
  id="scrolling-fit-to-content-table"
  aria-label="Line items"
  style="block-size: auto; max-block-size: 320px"
></argus-table>
