<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>argus-table: plain HTML</title>
  </head>
  <body>
    <h1>Orders</h1>
    <input id="search" type="search" placeholder="Search orders" aria-label="Search orders" />
    <argus-table
      id="orders"
      aria-label="Orders"
      selection-mode="multi"
      selection-checkboxes
    ></argus-table>
    <p id="selected" role="status">Click a row or its checkbox to select it.</p>
    <script type="module" src="/main.js"></script>
  </body>
</html>
