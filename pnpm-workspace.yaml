packages:
  - packages/*
  - apps/*
  - benchmarks
  - tests/*
  - tools/*

# Dependencies allowed to run install scripts (pnpm blocks the rest)
onlyBuiltDependencies:
  - nx

# Install scripts we skip on purpose: both ship prebuilt binaries that work without them
ignoredBuiltDependencies:
  - esbuild
  - rs-module-lexer
